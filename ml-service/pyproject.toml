[project]
name = "climatechain-ml-service"
version = "0.1.0"
description = "Premium pricing inference service for ClimateChain"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
# Chosen to match the strictness the Node modules already enforce: unused code,
# shadowed builtins, and implicit string concatenation are errors there too.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic numbers by design; naming them would hide the case.
"tests/*" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Warnings are failures by default. Dependency ranges here are open lower
# bounds, so an incompatibility arrives as a deprecation long before it arrives
# as a break — and a warning nobody fails on is a warning nobody reads.
#
# Each ignore is a known third-party notice with a reason and an owner, never a
# blanket mute. Our own code has none: a DeprecationWarning raised inside `app`
# fails the suite.
filterwarnings = [
    "error",
    # Starlette's TestClient warns that httpx is deprecated in favour of httpx2.
    # Test-only, no runtime path involved, and pinned open until Starlette
    # settles on a client. Revisit when FastAPI's dependency floor moves.
    #
    # No category is named: it raises StarletteDeprecationWarning, which is not
    # a DeprecationWarning subclass, and naming the wrong one silently fails to
    # match rather than erroring.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
