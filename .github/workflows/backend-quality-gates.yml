name: Backend Quality Gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/abi/**"
      - "contracts/deployments/**"
      - ".github/workflows/backend-quality-gates.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "shared/abi/**"
      - "contracts/deployments/**"
      - ".github/workflows/backend-quality-gates.yml"

jobs:
  backend-stage5-gates:
    name: backend-stage5-gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stage 05 full gate
        # Includes build, lint, format, unit + e2e tests, startup smoke, and the
        # OpenAPI drift check (api:check), so the local and CI gates are equivalent.
        run: npm run stage5:check
