name: Backend Quality Gates

on:
  pull_request:
    paths:
      # `contracts/**` in full, not just deployments: the chain integration job
      # compiles and deploys the real contracts, so any contract change can
      # break this gate.
      - "backend/**"
      - "contracts/**"
      - "shared/abi/**"
      - ".github/workflows/backend-quality-gates.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "contracts/**"
      - "shared/abi/**"
      - ".github/workflows/backend-quality-gates.yml"

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# Supersede in-flight runs for the same ref; the latest commit is the one that
# matters and stale runs only consume runners.
concurrency:
  group: backend-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-stage6-gates:
    name: backend-stage6-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Chain-free gate
        # Build, lint, format, blocking critical-severity audit, unit tests,
        # no-chain e2e, startup smoke, and the OpenAPI drift check.
        run: npm run stage5:check

      # Stage 06 integration is only proven by exercising it: the no-runtime-
      # mocks policy means a mocked chain adapter would validate nothing. CI
      # therefore runs a real node with the real contracts deployed.
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      - name: Start local chain
        working-directory: contracts
        run: |
          npx hardhat node > "${RUNNER_TEMP}/hardhat-node.log" 2>&1 &
          for _ in $(seq 1 40); do
            if curl -sf -X POST http://127.0.0.1:8545 \
                 -H 'content-type: application/json' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' >/dev/null; then
              echo "Chain is up"; exit 0
            fi
            sleep 1
          done
          echo "Chain did not start"; cat "${RUNNER_TEMP}/hardhat-node.log"; exit 1

      - name: Deploy contracts and fund the coverage reserve
        working-directory: contracts
        # A freshly deployed provider holds no reserve, so every createPolicy
        # would revert with InsufficientCoverageReserve without this step.
        run: |
          npm run deploy:localhost
          npm run reserve:fund:localhost

      - name: Stage 06 chain integration and coverage
        run: |
          npm run test:e2e:chain
          npm run test:cov

      - name: Upload chain log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-node-log
          path: ${{ runner.temp }}/hardhat-node.log
          if-no-files-found: ignore

      # `stage5:check` blocks on high-severity advisories reachable from
      # production dependencies, which is what actually ships. This step reports
      # the remaining dev-tooling advisories without blocking: they reach the
      # build toolchain, not the running service, and they are gated behind
      # transitive ranges the project does not control.
      - name: Dependency audit report (including dev, non-blocking)
        if: always()
        continue-on-error: true
        run: npm run audit:report
