name: Backend Quality Gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/abi/**"
      - "contracts/deployments/**"
      - ".github/workflows/backend-quality-gates.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "shared/abi/**"
      - "contracts/deployments/**"
      - ".github/workflows/backend-quality-gates.yml"

jobs:
  backend-stage5-gates:
    name: backend-stage5-gates
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stage 05 full gate
        run: npm run stage5:check

      - name: OpenAPI drift gate
        run: |
          npm run api:export
          if [[ -n "$(git status --porcelain ../docs/api/backend-openapi.json)" ]]; then
            echo "Detected OpenAPI drift. Run 'npm run api:export' and commit docs/api/backend-openapi.json."
            git --no-pager diff -- ../docs/api/backend-openapi.json
            exit 1
          fi
